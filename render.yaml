services:
  - type: web
    name: stokku
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run install:all && npm run build && npm --prefix server run prisma:generate
    startCommand: NODE_ENV=production npm run start:produksi
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
